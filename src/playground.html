<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommitMind API Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:      #ffffff;
      --bg:         #f5f6f8;
      --sidebar-bg: #f5f6f8;
      --surface:    #ffffff;
      --border:     #e5e7eb;
      --border-light: #f0f1f3;
      --text:       #111827;
      --muted:      #6b7280;
      --muted2:     #9ca3af;
      --green:      #16a34a;
      --green-btn:  #22c55e;
      --green-hover:#16a34a;
      --blue:       #2563eb;
      --orange:     #d97706;
      --red:        #dc2626;
      --purple:     #7c3aed;
      --terminal-bg:#0a0a0a;
      --terminal-text: #e5e7eb;
      --terminal-green: #4ade80;
      --terminal-muted: #4b5563;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 50px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 30px;
      height: 30px;
      background: var(--green);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: #fff;
      flex-shrink: 0;
    }

    .header-brand {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .header-tag {
      font-size: 11px;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green-btn);
    }

    /* LAYOUT */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      padding: 12px 0;
    }

    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); }

    .sidebar-section-label {
      padding: 10px 16px 5px;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted2);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.1s;
    }

    .sidebar-item:hover {
      background: var(--border-light);
    }

    .sidebar-item.active {
      background: #e8f5e9;
      border-left-color: var(--green);
    }

    .sidebar-item.active .sidebar-path {
      color: var(--green);
    }

    .method-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 500;
      padding: 2px 5px;
      border-radius: 3px;
      min-width: 36px;
      text-align: center;
      flex-shrink: 0;
    }

    .GET    { background: #dbeafe; color: #1d4ed8; }
    .POST   { background: #dcfce7; color: #15803d; }
    .PUT    { background: #fef9c3; color: #a16207; }
    .DELETE { background: #fee2e2; color: #b91c1c; }

    .sidebar-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* MAIN CENTER */
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--white);
      border-right: 1px solid var(--border);
    }

    .center-header {
      padding: 14px 20px 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .center-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }

    .request-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .request-method {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .request-url {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text);
      outline: none;
    }

    .center-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .field-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 5px;
      margin-top: 14px;
    }

    .field-label:first-child { margin-top: 0; }

    .token-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .token-input:focus { border-color: var(--green); }
    .token-input::placeholder { color: var(--muted2); }

    .token-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
    }

    .token-hint a {
      color: var(--green);
      text-decoration: none;
      font-weight: 500;
    }

    .token-hint a:hover { text-decoration: underline; }

    .body-textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text);
      resize: vertical;
      min-height: 90px;
      outline: none;
      transition: border-color 0.15s;
      line-height: 1.6;
    }

    .body-textarea:focus { border-color: var(--green); }

    .params-table {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .params-row {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border-light);
    }

    .params-row:last-child { border-bottom: none; }

    .param-name {
      width: 120px;
      padding: 7px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      border-right: 1px solid var(--border-light);
      background: var(--bg);
      flex-shrink: 0;
    }

    .param-input {
      flex: 1;
      padding: 7px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text);
      border: none;
      background: var(--white);
      outline: none;
    }

    .center-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .desc-text {
      font-size: 11px;
      color: var(--muted);
    }

    .run-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--green-btn);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      font-family: 'Inter', sans-serif;
    }

    .run-btn:hover { background: var(--green-hover); }
    .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .run-icon { font-size: 10px; }

    /* RIGHT PANEL - RESPONSE */
    .response-panel {
      width: 480px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--terminal-bg);
      overflow: hidden;
    }

    .response-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 42px;
      border-bottom: 1px solid #1f1f1f;
      flex-shrink: 0;
    }

    .response-tabs {
      display: flex;
      gap: 2px;
    }

    .tab {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 500;
      color: #6b7280;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.1s, color 0.1s;
    }

    .tab.active {
      background: #1f1f1f;
      color: var(--terminal-text);
    }

    .tab:hover:not(.active) { color: var(--terminal-text); }

    .terminal-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .terminal-dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .td-red    { background: #ff5f57; }
    .td-yellow { background: #febc2e; }
    .td-green  { background: #28c840; }

    .clear-btn {
      background: transparent;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 10px;
      color: #6b7280;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.15s, color 0.15s;
    }

    .clear-btn:hover { border-color: #444; color: var(--terminal-text); }

    .response-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.8;
      scrollbar-width: thin;
      scrollbar-color: #2a2a2a transparent;
    }

    .response-body::-webkit-scrollbar { width: 3px; }
    .response-body::-webkit-scrollbar-thumb { background: #2a2a2a; }

    .placeholder-msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      text-align: center;
      color: #3a3a3a;
    }

    .placeholder-msg .ph-icon {
      font-size: 28px;
      opacity: 0.4;
      color: var(--terminal-green);
    }

    .placeholder-msg p {
      font-size: 11px;
      color: #4a4a4a;
      line-height: 1.6;
    }

    .log-entry { margin-bottom: 18px; }

    .log-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: #4b5563;
      font-size: 10px;
    }

    .log-prompt { color: var(--terminal-green); }
    .log-path   { color: #9ca3af; }
    .log-status-ok   { color: var(--terminal-green); font-weight: 500; }
    .log-status-warn { color: #fbbf24; font-weight: 500; }
    .log-status-err  { color: #f87171; font-weight: 500; }
    .log-duration    { color: #374151; }

    .log-json {
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--terminal-text);
      font-size: 11px;
      line-height: 1.7;
      padding: 10px 12px;
      background: #111111;
      border-radius: 6px;
      border-left: 2px solid #1f1f1f;
    }

    .log-json.ok   { border-left-color: var(--terminal-green); }
    .log-json.err  { border-left-color: #f87171; color: #f87171; }
    .log-json.warn { border-left-color: #fbbf24; color: #fbbf24; }

    .log-divider {
      border: none;
      border-top: 1px solid #161616;
      margin-top: 16px;
    }

    .loading-anim::after {
      content: '';
      animation: ldots 1s steps(3, end) infinite;
    }

    @keyframes ldots {
      0%   { content: '.'; }
      33%  { content: '..'; }
      66%  { content: '...'; }
      100% { content: ''; }
    }

    /* Scrollbars */
    .center-body::-webkit-scrollbar { width: 3px; }
    .center-body::-webkit-scrollbar-thumb { background: var(--border); }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-left">
    <div class="logo">CM</div>
    <span class="header-brand">CommitMind</span>
    <span class="header-tag">API Playground</span>
  </div>
  <div class="header-right">
    <div class="live-badge">
      <span class="live-dot"></span>
      commitmind.onrender.com
    </div>
  </div>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar"></div>

  <!-- CENTER PANEL -->
  <div class="center">
    <div class="center-header">
      <div class="center-title" id="centerTitle">Select a request</div>
      <div class="request-line">
        <span class="request-method GET method-badge" id="centerMethod">GET</span>
        <input class="request-url" id="centerUrl" type="text" readonly value="https://commitmind.onrender.com" />
      </div>
    </div>

    <div class="center-body" id="centerBody">

      <!-- TOKEN -->
      <div class="field-label">JWT Token</div>
      <input
        class="token-input"
        id="tokenInput"
        type="password"
        placeholder="Paste your token here after login with GitHub..."
      />
      <div class="token-hint">
        No token yet? <a href="/auth/github" target="_blank">Login with GitHub</a> to get one.
      </div>

      <!-- PARAMS (injecté dynamiquement) -->
      <div id="paramsSection"></div>

      <!-- BODY (injecté dynamiquement) -->
      <div id="bodySection"></div>

    </div>

    <div class="center-footer">
      <span class="desc-text" id="centerDesc">Choose a request from the sidebar to get started.</span>
      <button class="run-btn" id="runBtn" onclick="runCurrent()">
        <span class="run-icon">&#9654;</span> Run
      </button>
    </div>
  </div>

  <!-- RESPONSE PANEL -->
  <div class="response-panel">
    <div class="response-header">
      <div class="terminal-dots">
        <span class="td-red"></span>
        <span class="td-yellow"></span>
        <span class="td-green"></span>
      </div>
      <div class="response-tabs">
        <div class="tab active">RESPONSE</div>
      </div>
      <button class="clear-btn" onclick="clearTerminal()">Clear</button>
    </div>
    <div class="response-body" id="terminal">
      <div class="placeholder-msg" id="placeholder">
        <div class="ph-icon">&#x276F;_</div>
        <p>Hit Run to see<br>the response here.</p>
      </div>
    </div>
  </div>

</div>

<script>
  const BASE = window.location.origin

  const ROUTES = [
    {
      section: 'Health',
      routes: [
        { method: 'GET', path: '/health', desc: 'Check API status', auth: false }
      ]
    },
    {
      section: 'Auth',
      routes: [
        { method: 'GET', path: '/auth/github', desc: 'Login with GitHub', auth: false, external: true },
        { method: 'GET', path: '/auth/me', desc: 'Current user profile', auth: true },
        { method: 'GET', path: '/auth/logout', desc: 'Logout info', auth: true }
      ]
    },
    {
      section: 'Repositories',
      routes: [
        { method: 'POST', path: '/repositories/sync', desc: 'Sync repos from GitHub', auth: true },
        { method: 'GET',  path: '/repositories', desc: 'List repositories', auth: true }
      ]
    },
    {
      section: 'Commits',
      routes: [
        { method: 'POST', path: '/repositories/:repoId/commits/sync', desc: 'Sync commits from GitHub', auth: true, params: ['repoId'] },
        { method: 'GET',  path: '/repositories/:repoId/commits', desc: 'List commits', auth: true, params: ['repoId'] },
        { method: 'POST', path: '/repositories/:repoId/commits/:commitId/files/sync', desc: 'Sync commit files', auth: true, params: ['repoId', 'commitId'] },
        { method: 'GET',  path: '/repositories/:repoId/commits/:commitId/files', desc: 'List commit files', auth: true, params: ['repoId', 'commitId'] }
      ]
    },
    {
      section: 'Concepts',
      routes: [
        { method: 'POST',   path: '/concepts', desc: 'Create a concept', auth: true, body: '{\n  "name": "JWT Authentication",\n  "description": "Token-based auth"\n}' },
        { method: 'GET',    path: '/concepts', desc: 'List concepts', auth: true },
        { method: 'GET',    path: '/concepts/:id', desc: 'Get a concept', auth: true, params: ['id'] },
        { method: 'PUT',    path: '/concepts/:id', desc: 'Update a concept', auth: true, params: ['id'], body: '{\n  "name": "JWT Authentication",\n  "description": "Updated description"\n}' },
        { method: 'DELETE', path: '/concepts/:id', desc: 'Delete a concept', auth: true, params: ['id'] },
        { method: 'GET',    path: '/concepts/:conceptId/commits', desc: 'Commits linked to a concept', auth: true, params: ['conceptId'] }
      ]
    },
    {
      section: 'Linking',
      routes: [
        { method: 'POST',   path: '/repositories/:repoId/commits/:commitId/concepts', desc: 'Link a concept manually', auth: true, params: ['repoId', 'commitId'], body: '{\n  "conceptId": 1\n}' },
        { method: 'POST',   path: '/repositories/:repoId/commits/:commitId/concepts/auto', desc: 'Auto-detect concepts', auth: true, params: ['repoId', 'commitId'] },
        { method: 'DELETE', path: '/repositories/:repoId/commits/:commitId/concepts/:conceptId', desc: 'Unlink a concept', auth: true, params: ['repoId', 'commitId', 'conceptId'] }
      ]
    },
    {
      section: 'History & Stats',
      routes: [
        { method: 'GET', path: '/history', desc: 'Learning timeline grouped by month', auth: true },
        { method: 'GET', path: '/stats',   desc: 'Progression statistics', auth: true }
      ]
    }
  ]

  let currentRoute = null
  let paramInputs = {}

  function buildSidebar() {
    const sidebar = document.getElementById('sidebar')

    ROUTES.forEach(group => {
      const label = document.createElement('div')
      label.className = 'sidebar-section-label'
      label.textContent = group.section
      sidebar.appendChild(label)

      group.routes.forEach(route => {
        const item = document.createElement('div')
        item.className = 'sidebar-item'
        item.dataset.path = route.path
        item.dataset.method = route.method

        const badge = document.createElement('span')
        badge.className = `method-badge ${route.method}`
        badge.textContent = route.method

        const path = document.createElement('span')
        path.className = 'sidebar-path'
        path.textContent = route.path

        item.appendChild(badge)
        item.appendChild(path)
        item.addEventListener('click', () => selectRoute(route, item))
        sidebar.appendChild(item)
      })
    })
  }

  function selectRoute(route, el) {
    // Mettre à jour la sidebar
    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'))
    el.classList.add('active')

    currentRoute = route
    paramInputs = {}

    // Mettre à jour le header center
    document.getElementById('centerTitle').textContent = route.desc
    const methodEl = document.getElementById('centerMethod')
    methodEl.className = `request-method method-badge ${route.method}`
    methodEl.textContent = route.method
    document.getElementById('centerUrl').value = BASE + route.path
    document.getElementById('centerDesc').textContent = route.desc

    // Params
    const paramsSection = document.getElementById('paramsSection')
    paramsSection.innerHTML = ''

    if (route.params && route.params.length > 0) {
      const label = document.createElement('div')
      label.className = 'field-label'
      label.textContent = 'Path parameters'
      paramsSection.appendChild(label)

      const table = document.createElement('div')
      table.className = 'params-table'

      route.params.forEach(param => {
        const row = document.createElement('div')
        row.className = 'params-row'

        const name = document.createElement('div')
        name.className = 'param-name'
        name.textContent = `:${param}`

        const input = document.createElement('input')
        input.className = 'param-input'
        input.type = 'text'
        input.placeholder = `Enter ${param}...`
        input.addEventListener('input', updateUrl)

        paramInputs[param] = input

        row.appendChild(name)
        row.appendChild(input)
        table.appendChild(row)
      })

      paramsSection.appendChild(table)
    }

    // Body
    const bodySection = document.getElementById('bodySection')
    bodySection.innerHTML = ''

    if (route.body) {
      const label = document.createElement('div')
      label.className = 'field-label'
      label.textContent = 'Request body (JSON)'

      const textarea = document.createElement('textarea')
      textarea.className = 'body-textarea'
      textarea.value = route.body
      textarea.id = 'bodyTextarea'

      bodySection.appendChild(label)
      bodySection.appendChild(textarea)
    }
  }

  function updateUrl() {
    if (!currentRoute) return
    let path = currentRoute.path
    for (const [param, input] of Object.entries(paramInputs)) {
      const val = input.value.trim() || `:${param}`
      path = path.replace(`:${param}`, val)
    }
    document.getElementById('centerUrl').value = BASE + path
  }

  function resolvePath() {
    if (!currentRoute) return null
    let path = currentRoute.path
    for (const [param, input] of Object.entries(paramInputs)) {
      const val = input.value.trim()
      if (!val) {
        alert(`Please fill in the parameter: ${param}`)
        return null
      }
      path = path.replace(`:${param}`, val)
    }
    return path
  }

  let loadingId = null

  async function runCurrent() {
    if (!currentRoute) {
      alert('Please select a request from the sidebar first.')
      return
    }

    if (currentRoute.external) {
      window.open(BASE + currentRoute.path, '_blank')
      return
    }

    const token = document.getElementById('tokenInput').value.trim()
    if (currentRoute.auth && !token) {
      appendError(currentRoute, currentRoute.path, 'No token provided. Paste your JWT token above.')
      return
    }

    const resolvedPath = resolvePath()
    if (!resolvedPath) return

    const headers = { 'Content-Type': 'application/json' }
    if (currentRoute.auth && token) headers['Authorization'] = `Bearer ${token}`

    const options = { method: currentRoute.method, headers }

    const bodyTextarea = document.getElementById('bodyTextarea')
    if (bodyTextarea && (currentRoute.method === 'POST' || currentRoute.method === 'PUT')) {
      try {
        JSON.parse(bodyTextarea.value)
        options.body = bodyTextarea.value
      } catch {
        appendError(currentRoute, resolvedPath, 'Invalid JSON in request body.')
        return
      }
    }

    const btn = document.getElementById('runBtn')
    btn.disabled = true
    btn.innerHTML = '<span class="run-icon loading-anim">Running</span>'

    const id = `log-${Date.now()}`
    loadingId = id
    appendLoading(currentRoute, resolvedPath, id)

    const start = Date.now()

    try {
      const res = await fetch(BASE + resolvedPath, options)
      const duration = Date.now() - start
      let data
      const ct = res.headers.get('content-type') || ''
      data = ct.includes('application/json') ? await res.json() : await res.text()
      updateLoading(id, currentRoute, resolvedPath, res.status, data, duration)
    } catch (err) {
      updateLoadingFail(id, currentRoute, resolvedPath, err.message)
    } finally {
      btn.disabled = false
      btn.innerHTML = '<span class="run-icon">&#9654;</span> Run'
    }
  }

  function hidePlaceholder() {
    const p = document.getElementById('placeholder')
    if (p) p.style.display = 'none'
  }

  function appendLoading(route, path, id) {
    hidePlaceholder()
    const terminal = document.getElementById('terminal')
    const entry = document.createElement('div')
    entry.className = 'log-entry'
    entry.id = id
    entry.innerHTML = `
      <div class="log-meta">
        <span class="log-prompt">&#x276F;</span>
        <span class="method-badge ${route.method}" style="font-size:9px;padding:1px 5px;">${route.method}</span>
        <span class="log-path">${path}</span>
      </div>
      <div class="log-json loading-anim" style="color:#4b5563">Waiting</div>
    `
    terminal.appendChild(entry)
    terminal.scrollTop = terminal.scrollHeight
  }

  function updateLoading(id, route, path, status, data, duration) {
    const entry = document.getElementById(id)
    if (!entry) return

    const isOk   = status >= 200 && status < 300
    const isWarn = status >= 400 && status < 500
    const statusClass = isOk ? 'log-status-ok' : isWarn ? 'log-status-warn' : 'log-status-err'
    const jsonClass   = isOk ? 'ok' : isWarn ? 'warn' : 'err'

    const formatted = typeof data === 'string' ? data : JSON.stringify(data, null, 2)

    entry.innerHTML = `
      <div class="log-meta">
        <span class="log-prompt">&#x276F;</span>
        <span class="method-badge ${route.method}" style="font-size:9px;padding:1px 5px;">${route.method}</span>
        <span class="log-path">${path}</span>
        <span class="${statusClass}">${status}</span>
        <span class="log-duration">${duration}ms</span>
      </div>
      <div class="log-json ${jsonClass}">${escapeHtml(formatted)}</div>
      <hr class="log-divider" />
    `
    const terminal = document.getElementById('terminal')
    terminal.scrollTop = terminal.scrollHeight
  }

  function updateLoadingFail(id, route, path, message) {
    const entry = document.getElementById(id)
    if (!entry) return
    entry.innerHTML = `
      <div class="log-meta">
        <span class="log-prompt">&#x276F;</span>
        <span class="method-badge ${route.method}" style="font-size:9px;padding:1px 5px;">${route.method}</span>
        <span class="log-path">${path}</span>
        <span class="log-status-err">Network Error</span>
      </div>
      <div class="log-json err">${escapeHtml(message)}</div>
      <hr class="log-divider" />
    `
  }

  function appendError(route, path, message) {
    hidePlaceholder()
    const terminal = document.getElementById('terminal')
    const entry = document.createElement('div')
    entry.className = 'log-entry'
    entry.innerHTML = `
      <div class="log-meta">
        <span class="log-prompt">&#x276F;</span>
        <span class="log-path">${path}</span>
        <span class="log-status-warn">Warning</span>
      </div>
      <div class="log-json warn">${escapeHtml(message)}</div>
      <hr class="log-divider" />
    `
    terminal.appendChild(entry)
    terminal.scrollTop = terminal.scrollHeight
  }

  function clearTerminal() {
    document.getElementById('terminal').innerHTML = `
      <div class="placeholder-msg" id="placeholder">
        <div class="ph-icon">&#x276F;_</div>
        <p>Hit Run to see<br>the response here.</p>
      </div>
    `
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
  }

  buildSidebar()
</script>
</body>
</html>
